<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.tailwindcss.com"></script>
	<title>Document</title>
</head>

<body class="bg-[url('/images/background.png')] bg-cover bg-center bg-no-repeat min-h-screen">
	<header>
		<div class="p-4">
			<div class="grid grid-cols-12 bg-[#595959]/30 rounded-3xl backdrop-blur-lg py-2 items-center">
				<div class="col-span-6 md:col-span-6 text-start pl-4">
					<a href="#" class="font-bold text-2xl text-black">Baztami</a>
				</div>

				<div class="col-span-6 md:col-span-6 flex justify-end items-center gap-4 pr-4">
					<a href="#"><img src="/images/icon-notification.png" alt="Notification" class="w-3 h-4" /></a>
					<a href="#"><img src="/images/login-character.png" alt="User" class="w-8 h-8 rounded-full" /></a>
				</div>
			</div>
		</div>
	</header>

	<section class="p-8 md:p-20 text-white">
		<div class="mb-10">
			<h1 class="text-left text-4xl md:text-5xl font-bold tracking-tighter">
				Welcome to <span class="text-[#68C579]">Baztami</span>
			</h1>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
			<!-- Revenus -->
			<div class="bg-black/10 p-6 rounded-2xl shadow-xl h-40 grid">
				<p class="font-bold text-3xl self-start justify-self-start">
					Revenus
				</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<p class="text-green-500 text-5xl font-bold">+</p>
					<div class="tracking-wide text-6xl font-bold leading-none">
						<span>1200</span>
						<span>£</span>
					</div>
				</div>
			</div>

			<!-- Dépenses -->
			<div class="bg-black/10 p-6 rounded-2xl shadow-xl h-40 grid">
				<p class="font-bold text-3xl self-start justify-self-start">
					Dépenses
				</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<p class="text-red-500 text-5xl font-bold">-</p>
					<div class="tracking-wide text-6xl font-bold leading-none">
						<span>1200</span>
						<span>£</span>
					</div>
				</div>
			</div>

			<!-- Solde -->
			<div class="bg-black/10 p-6 rounded-2xl shadow-xl h-40 grid">
				<p class="font-bold text-3xl self-start justify-self-start">Solde</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<p class="text-green-500 text-5xl font-bold">+</p>
					<div class="tracking-wide text-6xl font-bold leading-none">
						<span>1200</span>
						<span>£</span>
					</div>
				</div>
			</div>
		</div>
		<div class="grid grid-cols-1 pt-2 md:grid-cols-2 gap-3">
			<button
				class="bg-red-400 text-center col-span-2 p-2 rounded-3xl border-2 border-red-600 hover:bg-red-600 active:bg-red-500">
				Deposite
			</button>
			<button
				class="bg-green-400 text-center col-span-2 p-2 rounded-3xl border-2 border-green-600 hover:bg-green-600 active:bg-green-500">
				Revenus
			</button>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">

			<div class="bg-black/50 grid p-3 rounded-xl border border-white/10 pt-2">
				<div class="grid grid-cols-12 items-center gap-2">
					<!-- Wallet Icon -->
					<img src="/images/wallet-icon.png" alt="" class="bg-green-600 rounded-lg w-8 h-7 p-1 col-span-1" />

					<!-- Description -->
					<p class="col-span-6 text-white">This is a paragraph</p>

					<!-- Amount -->
					<div class="flex items-center justify-end col-span-3 text-white">
						<p class="text-green-500 font-bold text-xl mr-1">+</p>
						<div class="font-bold text-xl">
							<span>700</span><span>£</span>
						</div>
					</div>

					<!-- Action Buttons -->
					<div class="flex justify-end col-span-2 gap-2">
						<a href="#"><img src="/images/edit-icon.png" alt=""
								class="w-6 h-6 bg-yellow-500 rounded-lg p-1 cursor-pointer hover:bg-yellow-600" /></a>
						<a href="#"><img src="/images/delete-icon.png" alt=""
								class="w-6 h-6 bg-red-500 rounded-lg p-1 cursor-pointer hover:bg-red-600" /></a>
					</div>
				</div>



			</div>

			<div class="bg-black/50 grid p-3 rounded-xl border border-white/10 pt-2">
				<div class="grid grid-cols-12 items-center gap-2">
					<!-- House Icon -->
					<img src="/images/house-icon.png" alt="" class="bg-red-600 rounded-lg w-7 h-7 p-1 col-span-1" />

					<!-- Description -->
					<p class="col-span-6 text-white">This is a paragraph</p>

					<!-- Amount -->
					<div class="flex items-center justify-end col-span-3 text-white">
						<p class="text-red-500 font-bold text-xl mr-1">-</p>
						<div class="font-bold text-xl">
							<span>700</span><span>£</span>
						</div>
					</div>

					<!-- Action Buttons -->
					<div class="flex justify-end col-span-2 gap-2">
						<a href="#"><img src="/images/edit-icon.png" alt=""
								class="w-6 h-6 bg-yellow-500 rounded-lg p-1 cursor-pointer hover:bg-yellow-600" /></a>
						<a href="#"><img src="/images/delete-icon.png" alt=""
								class="w-6 h-6 bg-red-500 rounded-lg p-1 cursor-pointer hover:bg-red-600" /></a>
					</div>
				</div>
			</div>

		</div>
	</section>
</body>

</html>
