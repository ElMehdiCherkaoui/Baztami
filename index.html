<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.tailwindcss.com"></script>

	<title>Document</title>
</head>

<body class="bg-[url('/images/background.png')] bg-cover bg-center bg-no-repeat min-h-screen">
	<header>
		<div class="p-4">
			<div class="grid grid-cols-12 bg-[#595959]/30 rounded-3xl backdrop-blur-lg py-2 items-center">
				<div class="col-span-6 md:col-span-6 text-start pl-4">
					<a href="#" class="font-bold text-2xl text-black">Baztami</a>
				</div>

				<div class="col-span-6 md:col-span-6 flex justify-end items-center gap-4 pr-4">
					<a href="#"><img src="/images/icon-notification.png" alt="Notification" class="w-3 h-4" /></a>
					<a href="#"><img src="/images/login-character.png" alt="User" class="w-8 h-8 rounded-full" /></a>
				</div>
			</div>
		</div>
	</header>

	<section class="p-8 md:p-20 text-white">
		<div class="h-32">
			<div class="grid grid-cols-2 items-center gap-2">

				<div>
					<h1 class="text-left text-3xl md:text-4xl font-bold tracking-tight">
						Welcome to <span class="text-[#68C579]">Baztami</span>
					</h1>
				</div>


				<div id="add"
					class="justify-self-end bg-black/80 text-2xl px-2 py-1 rounded-md cursor-pointer active:bg-black/60">
					+
				</div>
			</div>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-6 gap-3">

			<div class="bg-black/10 p-3 rounded-lg shadow-md h-28 grid col-span-2">
				<p class="font-semibold text-lg self-start justify-self-start">
					Revenus
				</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<p class="text-green-500 text-2xl font-bold">+</p>
					<div class="tracking-wide text-3xl font-bold leading-none">
						<span id="Revenus">0</span>
						<span>£</span>
					</div>
				</div>
			</div>


			<div class="bg-black/10 p-3 rounded-lg shadow-md h-28 grid col-span-2">
				<p class="font-semibold text-lg self-start justify-self-start">
					Dépenses
				</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<p class="text-red-500 text-2xl font-bold">-</p>
					<div class="tracking-wide text-3xl font-bold leading-none">
						<span id="Deposit">0</span>
						<span>£</span>
					</div>
				</div>
			</div>


			<div class="bg-black/10 p-3 rounded-lg shadow-md h-28 grid col-span-2">
				<p class="font-semibold text-lg self-start justify-self-start">
					Solde
				</p>
				<div class="flex items-center gap-1 self-end justify-self-end">
					<div class="tracking-wide text-3xl font-bold leading-none">
						<span id="sold">0</span>
						<span>£</span>
					</div>
				</div>
			</div>
		</div>


		<div id="popup" class="hidden fixed inset-0 bg-black/60 flex items-start justify-center pt-20">
			<div class="bg-white rounded-2xl w-[25em] shadow-xl p-6">
				<div class="flex justify-between items-center mb-4">
					<h1 class="font-bold text-xl text-black">Add Transaction</h1>
					<img src="/images/exit-icon.png" alt="close" id="closebtn" class="w-7 cursor-pointer" />
				</div>

				<div class="mb-4">
					<label class="block mb-2 text-black font-semibold">Transaction type:</label>
					<select id="typeselect"
						class="w-full border border-gray-400 rounded-lg p-2 text-black bg-gray-100 focus:ring-2 focus:ring-purple-500">
						<option value="deposite">Deposit</option>
						<option value="revenus">Revenus</option>
					</select>
				</div>

				<div class="mb-6">
					<label class="block mb-2 text-black font-semibold">Amount:</label>
					<input type="number" placeholder="Enter amount" id="amountinput"
						class="text-black w-full border border-gray-400 p-2 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
				</div>
				<div class="mb-4">
					<label class="lock mb-2 text-black font-semibold">
						Description</label>
					<input type="text" placeholder="here..." id="Description_popup"
						class="text-black w-full border border-gray-400 p-2 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-red-500" />
				</div>
				<div class="mb-4">
					<label class="lock mb-2 text-black font-semibold">date</label>
					<input type="date" id="date_popup"
						class="text-black w-full border border-gray-400 p-2 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
				</div>

				<div class="text-center">
					<button id="submitbtn"
						class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-red-500 active:bg-red-700 transition-all">
						Submit
					</button>
				</div>
			</div>
		</div>
		<div id="popup_edit" class="hidden fixed inset-0 bg-black/60 flex items-start justify-center pt-20">
			<div class="bg-white rounded-2xl w-[25em] shadow-xl p-6">
				<div class="flex justify-between items-center mb-4">
					<h1 class="font-bold text-xl text-black">edit Transaction</h1>
					<img src="/images/exit-icon.png" alt="close" id="closebtn_edit" class="w-7 cursor-pointer" />
				</div>

				<div class="mb-6">
					<label class="block mb-2 text-black font-semibold">Amount:</label>
					<input type="number" placeholder="Enter amount" id="amountinput_edit"
						class="text-black w-full border border-gray-400 p-2 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
				</div>
				<div class="mb-4">
					<label class="lock mb-2 text-black font-semibold">
						Description</label>
					<input type="text" placeholder="here..." id="Description_popup"
						class="text-black w-full border border-gray-400 p-2 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-red-500" />
				</div>

				<div class="text-center">
					<button id="submitbtn_edit"
						class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-red-500 active:bg-red-700 transition-all">
						Submit edit
					</button>
				</div>
			</div>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
			<div class="bg-black/40 grid p-2 rounded-lg border border-white/10" id="rev">

			</div>

			<div class="bg-black/40 grid p-2 rounded-lg border border-white/10" id="depo">
				
				</div>
			</div>
		</div>
	</section>
	<script src="/js/app.js"></script>
</body>

</html>
